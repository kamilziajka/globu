name: Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "docs/log.md"

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.ANTHROPIC_FEDERATION_RULE_ID != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}

            Review this pull request as the second reader before the owner. Read the diff with
            `gh pr diff`, the description with `gh pr view` and every file you need around it.

            The repository's own rules are the standard: CLAUDE.md, docs/development.md and the
            docs the change touches. Look for, in this order:

            1. Bugs: wrong behaviour, a broken edge case, a race, a path that breaks on Windows.
            2. Broken rules from CLAUDE.md: coverage thresholds lowered or ignore directives added,
               comments in code, packages/knowledge-base importing packages/globu-core, a hand
               edit of the pinned plugin files or of the version in plugin.json.
            3. Docs that no longer match the code: a changed command, flag, hook or skill without
               its doc in docs or plugins/globu/skills, or a docs change without a docs/log.md entry.
            4. Prose that breaks the writing style: em or en dashes, the Oxford comma, a directory
               named with a trailing slash.

            Post each real problem as an inline comment on the line it is about, with
            confirmed=true, saying what is wrong and what would fix it. Say nothing about what is
            fine, about taste or about style that Biome already checks. Then post one summary with
            `gh pr comment`: one line with the number of findings, then one line per finding. When
            there are none, the summary says so in one line.
          claude_args: |
            --model claude-haiku-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
