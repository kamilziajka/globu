name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, build and test
        run: npm run verify

      - name: Pack the packages and pin the plugins to them
        run: npm run pin

      - name: Refuse a version that is already released
        run: |
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged: bump the version in package.json first"
            exit 1
          fi

      - name: Publish the packages
        run: |
          node -e '
            for (const { name, version, tarball } of require("./release/packages.json")) {
              console.log(`${name}\t${version}\t${tarball}`);
            }
          ' | while IFS=$'\t' read -r name version tarball; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
            elif ! npm view "$name" name >/dev/null 2>&1; then
              echo "::warning::$name is not on npm yet. Its first release is done by hand, see docs/development.md, then npm trust binds it to this workflow."
            else
              npm publish "$tarball"
            fi
          done

      - name: Wait until the published packages can be downloaded
        run: |
          node -e '
            for (const { name, resolved } of require("./release/packages.json")) console.log(`${name}\t${resolved}`);
          ' | while IFS=$'\t' read -r name url; do
            if ! npm view "$name" name >/dev/null 2>&1; then
              echo "$name is not on npm, nothing to wait for"
              continue
            fi
            for attempt in $(seq 1 60); do
              if curl --silent --fail --output /dev/null "$url"; then
                echo "$url is available"
                continue 2
              fi
              sleep 10
            done
            echo "$url is still not available after 10 minutes"
            exit 1
          done

      - name: Commit the pins, move the stable branch and tag the release
        env:
          HUSKY: "0"
        run: |
          version=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins
          git commit -m "Pin plugins to $version"
          git tag "v$version"
          git push origin HEAD:main
          git push origin HEAD:stable
          git push origin "v$version"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          notes=$(node -e '
            const lines = [];
            for (const { name, version } of require("./release/packages.json")) {
              lines.push(`- [${name}@${version}](https://www.npmjs.com/package/${name}/v/${version})`);
            }
            console.log(lines.join("\n"));
          ')
          gh release create "v$version" \
            --title "Globu $version" \
            --notes "$(printf 'Packages:\n%s\n\nThe plugins on the `stable` branch are pinned to this release. The documentation is at https://globu.kazet.blog.' "$notes")" \
            --generate-notes
