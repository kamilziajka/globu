name: Verify

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, build and test
        run: npm run verify

      - name: Check that the committed package versions are up to date
        run: git diff --exit-code --stat -- packages/globu-cli/package.json packages/globu-worker/package.json
